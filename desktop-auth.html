<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión con Google - Zenwii Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: radial-gradient(circle at 12% 8%, rgba(41, 199, 46, 0.15), transparent 35%), #eaffec;
      color: #1f1f1f;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(16, 118, 20, 0.08);
      max-width: 400px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      animation: enter 350ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .logo-container {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, #29c72e, #20a724);
      color: white;
      font-size: 28px;
      box-shadow: 0 10px 24px rgba(41, 199, 46, 0.24);
    }
    h1 {
      font-size: 22px;
      color: #20a724;
      margin: 0 0 10px;
      font-weight: 700;
    }
    p {
      font-size: 13px;
      color: #4a774c;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    .btn {
      width: 100%;
      height: 46px;
      background: linear-gradient(135deg, #29c72e, #20a724);
      color: white;
      border: 0;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 24px rgba(41, 199, 46, 0.2);
      transition: transform 200ms ease, box-shadow 200ms ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(41, 199, 46, 0.3);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    #error {
      color: #ff3849;
      margin-top: 15px;
      font-size: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <i class="fa-solid fa-feather-pointed"></i>
    </div>
    <h1>Zenwii Desktop</h1>
    <p>Conéctate con tu cuenta de Google para sincronizar tus notas en la nube de forma segura de un extremo a otro.</p>
    
    <button class="btn" id="loginBtn" onclick="startLogin()">
      <i class="fa-brands fa-google"></i> Iniciar sesión con Google
    </button>
    <div id="error"></div>
  </div>

  <!-- Script de Firebase modular cargado desde CDN oficial de Google -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

    // Credenciales oficiales de Zenwii
    const firebaseConfig = {
      apiKey: "AIzaSyCUkRI7lXA6AMVTbjmbidxorSmfLUbnpfk",
      authDomain: "zenwii.firebaseapp.com",
      projectId: "zenwii",
      storageBucket: "zenwii.firebasestorage.app",
      messagingSenderId: "254455103795",
      appId: "1:254455103795:web:a6b12f7136c955078ffe46"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    window.startLogin = function() {
      const btn = document.getElementById("loginBtn");
      const errDiv = document.getElementById("error");
      
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Conectando...';
      errDiv.innerText = "";

      signInWithPopup(auth, provider).then(async (result) => {
        const credential = GoogleAuthProvider.credentialFromResult(result);
        const accessToken = credential.accessToken;
        const idToken = credential.idToken;
        
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Redirigiendo a Zenwii...';
        
        // Redirigir la sesión al puerto local del Rust Listener
        window.location.href = `http://localhost:1425/?idToken=${idToken}&accessToken=${accessToken}`;
      }).catch(err => {
        console.error(err);
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-brands fa-google"></i> Iniciar sesión con Google';
        errDiv.innerText = "Error: " + (err.message || "No se pudo completar el inicio de sesión.");
      });
    }
  </script>
</body>
</html>
